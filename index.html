<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Missing You 💗🐾</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
              <style>
                  :root {
                        --bg-gradient: linear-gradient(135deg, #ffd1dc 0%, #ffe3ec 35%, #f0e6ff 100%);
                              --card-bg: rgba(255, 255, 255, 0.95);
                                    --primary: #ff477e;
                                          --secondary: #b5179e;
                                                --text-dark: #2b2d42;
                                                      --shadow: 0 20px 40px rgba(255, 105, 135, 0.2);
                                                          }
                                                              * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
                                                                  body {
                                                                        font-family: 'Nunito', sans-serif;
                                                                              background: var(--bg-gradient);
                                                                                    min-height: 100vh;
                                                                                          display: flex; justify-content: center; align-items: center;
                                                                                                padding: 16px; overflow-x: hidden; position: relative;
                                                                                                    }
                                                                                                        .bg-elements { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
                                                                                                            .floating-item { position: absolute; font-size: 1.5rem; opacity: 0.25; animation: floatUp 12s infinite linear; }
                                                                                                                @keyframes floatUp {
                                                                                                                      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
                                                                                                                            20%, 80% { opacity: 0.35; }
                                                                                                                                  100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
